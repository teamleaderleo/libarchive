name: Fieldwork non-seekable 7-Zip probe

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork-nonseekable-7zip.yml'
      - 'contrib/fieldwork/nonseekable_7zip_probe.sh'
      - 'libarchive/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build p7zip-full \
            libacl1-dev libbz2-dev liblz4-dev liblzma-dev \
            libssl-dev libxml2-dev libzstd-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DENABLE_TEST=ON -DENABLE_WERROR=OFF
      - name: Build bsdtar
        run: cmake --build build --target bsdtar
      - name: Run transport matrix
        run: |
          BSDTAR=$(find build -type f -name bsdtar -perm -111 -print -quit)
          test -n "$BSDTAR"
          sh contrib/fieldwork/nonseekable_7zip_probe.sh "$BSDTAR" | tee fieldwork-results.txt
          cat fieldwork-results.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact probe output
        uses: actions/upload-artifact@v4
        with:
          name: nonseekable-7zip-probe
          path: |
            fieldwork-results.txt
            fieldwork-artifacts/
          if-no-files-found: error
