---
name: Fieldwork promote zero-inode hardlinks

on:
  push:
    branches:
      - linux-fieldwork/cpio-newc-large-inode-product
    paths:
      - ".github/workflows/fieldwork-promote-zero-inode-hardlinks.yml"
      - "contrib/fieldwork/cpio-newc-zero-inode-promote.patch"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact product head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact green correction and commit product files
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:libarchive/archive_write_set_format_cpio_newc.c)" = 693f4c579713ea0f00dd4a313e0171f10c7d2121
          test "$(git rev-parse HEAD:libarchive/test/test_write_format_cpio_newc.c)" = 593c3cf375cd21ced193b014d12ec202ea1ec130
          test "$(git rev-parse HEAD:contrib/fieldwork/cpio-newc-zero-inode-promote.patch)" = 7d9310bdd2a3879787faac2782675a3e97ebd399
          git apply --check --whitespace=error-all contrib/fieldwork/cpio-newc-zero-inode-promote.patch
          git apply --whitespace=error-all contrib/fieldwork/cpio-newc-zero-inode-promote.patch
          git diff --check
          test "$(git hash-object libarchive/archive_write_set_format_cpio_newc.c)" = 7ef76c5ee8b4f083ef747a5992ce1e33af1446c8
          test "$(git hash-object libarchive/test/test_write_format_cpio_newc.c)" = 1fe62f592d9f8e8e70b19add1f544926ddbf380a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add libarchive/archive_write_set_format_cpio_newc.c libarchive/test/test_write_format_cpio_newc.c
          git commit -m 'cpio: map zero-inode hardlink identities'
          git push origin HEAD:linux-fieldwork/cpio-newc-large-inode-product
