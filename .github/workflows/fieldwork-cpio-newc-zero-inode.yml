name: Fieldwork cpio newc zero-inode hardlinks

on:
  push:
    branches:
      - linux-fieldwork/cpio-newc-zero-inode-hardlinks
  pull_request:
    paths:
      - contrib/fieldwork/cpio-newc-zero-inode-hardlinks.patch
      - .github/workflows/fieldwork-cpio-newc-zero-inode.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-inode-hardlinks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify execution identity
        shell: bash
        run: |
          set -euxo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          mkdir -p fieldwork-evidence
          {
            echo "EXPECTED_HEAD=$expected"
            echo "ACTUAL_HEAD=$actual"
            echo "BASE_NEWC_BLOB=$(git rev-parse HEAD:libarchive/archive_write_set_format_cpio_newc.c)"
            echo "BASE_TEST_BLOB=$(git rev-parse HEAD:libarchive/test/test_write_format_cpio_newc.c)"
            echo "PATCH_BLOB=$(git rev-parse HEAD:contrib/fieldwork/cpio-newc-zero-inode-hardlinks.patch)"
            echo "PRODUCT_SOURCE_COMMITTED=false"
            echo "EXTERNAL_CONTACT=false"
          } | tee fieldwork-evidence/receipt.txt

      - name: Apply zero-inode correction
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check --whitespace=error-all contrib/fieldwork/cpio-newc-zero-inode-hardlinks.patch
          git apply --whitespace=error-all contrib/fieldwork/cpio-newc-zero-inode-hardlinks.patch
          git diff --check
          git diff -- libarchive/archive_write_set_format_cpio_newc.c libarchive/test/test_write_format_cpio_newc.c | tee fieldwork-evidence/applied.diff
          cp libarchive/archive_write_set_format_cpio_newc.c fieldwork-evidence/archive_write_set_format_cpio_newc.c
          cp libarchive/test/test_write_format_cpio_newc.c fieldwork-evidence/test_write_format_cpio_newc.c
          sha256sum fieldwork-evidence/archive_write_set_format_cpio_newc.c fieldwork-evidence/test_write_format_cpio_newc.c | tee fieldwork-evidence/patched-files.sha256

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libacl1-dev libbz2-dev liblz4-dev liblzma-dev libssl-dev libxml2-dev zlib1g-dev

      - name: Configure and build native test binary
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DENABLE_TEST=ON
          cmake --build build --target libarchive_test --parallel 2 2>&1 | tee fieldwork-evidence/build.log

      - name: Run native libarchive tests
        shell: bash
        run: |
          set -euxo pipefail
          test_bin="$(find build -type f -name libarchive_test -perm -111 -print -quit)"
          test -n "$test_bin"
          "$test_bin" -r "$GITHUB_WORKSPACE/libarchive/test" -vv 2>&1 | tee fieldwork-evidence/test.log

      - name: Record patched identities
        if: always()
        shell: bash
        run: |
          {
            echo "PATCHED_NEWC_BLOB=$(git hash-object libarchive/archive_write_set_format_cpio_newc.c)"
            echo "PATCHED_TEST_BLOB=$(git hash-object libarchive/test/test_write_format_cpio_newc.c)"
          } | tee -a fieldwork-evidence/receipt.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpio-newc-zero-inode-${{ github.run_id }}
          path: fieldwork-evidence
          if-no-files-found: error
