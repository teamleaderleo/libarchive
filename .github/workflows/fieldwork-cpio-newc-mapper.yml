name: Fieldwork cpio newc inode mapper

on:
  push:
    branches:
      - linux-fieldwork/cpio-newc-large-inode-mapper
  pull_request:
    paths:
      - libarchive/archive_write_set_format_cpio_newc.c
      - libarchive/test/test_write_format_cpio_newc.c
      - contrib/fieldwork/cpio-newc-large-inode-mapper.patch
      - .github/workflows/fieldwork-cpio-newc-mapper.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record and verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          mkdir -p fieldwork-evidence
          {
            echo "EXPECTED_HEAD=$expected"
            echo "ACTUAL_HEAD=$actual"
            echo "NEWC_SOURCE_BLOB=$(git rev-parse HEAD:libarchive/archive_write_set_format_cpio_newc.c)"
            echo "TEST_SOURCE_BLOB=$(git rev-parse HEAD:libarchive/test/test_write_format_cpio_newc.c)"
            echo "PATCH_BLOB=$(git rev-parse HEAD:contrib/fieldwork/cpio-newc-large-inode-mapper.patch)"
          } | tee fieldwork-evidence/receipt.txt

      - name: Apply candidate patch
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check contrib/fieldwork/cpio-newc-large-inode-mapper.patch
          git apply contrib/fieldwork/cpio-newc-large-inode-mapper.patch
          git diff --check
          git diff -- libarchive/archive_write_set_format_cpio_newc.c |
            tee fieldwork-evidence/applied.diff
          sha256sum libarchive/archive_write_set_format_cpio_newc.c |
            tee fieldwork-evidence/patched-source.sha256

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libacl1-dev libbz2-dev liblz4-dev \
            liblzma-dev libssl-dev libxml2-dev zlib1g-dev

      - name: Configure and build focused test binary
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DENABLE_TEST=ON
          cmake --build build --target libarchive_test --parallel 2 2>&1 |
            tee fieldwork-evidence/build.log

      - name: Run native libarchive tests
        shell: bash
        run: |
          set -euxo pipefail
          test_bin="$(find build -type f -name libarchive_test -perm -111 -print -quit)"
          test -n "$test_bin"
          "$test_bin" -r "$GITHUB_WORKSPACE/libarchive/test" -vv 2>&1 |
            tee fieldwork-evidence/test.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpio-newc-inode-mapper-${{ github.run_id }}
          path: fieldwork-evidence
          if-no-files-found: warn
