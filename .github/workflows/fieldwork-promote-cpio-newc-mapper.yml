---
name: Fieldwork promote cpio newc mapper

on:
  push:
    branches:
      - linux-fieldwork/cpio-newc-large-inode-product
    paths:
      - ".github/workflows/fieldwork-promote-cpio-newc-mapper.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: linux-fieldwork/cpio-newc-large-inode-product
          fetch-depth: 0

      - name: Apply tested mapper and commit product source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq 'test_write_format_cpio_newc_large_inode_identity' \
            libarchive/test/test_write_format_cpio_newc.c
          grep -Fq 'small_entry' libarchive/test/test_write_format_cpio_newc.c
          git apply --check --whitespace=error-all \
            contrib/fieldwork/cpio-newc-large-inode-mapper.patch
          git apply --whitespace=error-all \
            contrib/fieldwork/cpio-newc-large-inode-mapper.patch
          git diff --check
          grep -Fq 'synthesize_ino_value' \
            libarchive/archive_write_set_format_cpio_newc.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add libarchive/archive_write_set_format_cpio_newc.c
          git commit -m 'cpio: preserve large inode identities in newc'
          git push origin HEAD:linux-fieldwork/cpio-newc-large-inode-product
